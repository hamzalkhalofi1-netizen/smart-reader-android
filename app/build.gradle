plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.smartreader.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.smartreader.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug { debuggable true }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures { viewBinding true }

    packagingOptions {
        resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] }
    }
}

dependencies {
    // Core AndroidX
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    // Splash Screen API
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // ViewPager2 — onboarding wizard
    implementation 'androidx.viewpager2:viewpager2:1.0.0'

    // DataStore — persisting onboarding choices & settings
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // Navigation Component — drawer + in-app nav
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.6'

    // ViewModel + LiveData + Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // DrawerLayout + CoordinatorLayout
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'

    // RecyclerView (chapter/content lists)
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // WorkManager — background download pipeline
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
}
